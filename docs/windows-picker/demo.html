<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>窗口总览 · 出现 / 散开</title>
    <style>
      /* ============================================================
       设计变量
       ============================================================ */
      :root {
        --bg: #0a0d13;
        --surface-low: #141a24;
        --surface: #18202c;
        --surface-high: #202a39;

        --text: #d7dde9;
        --text-dim: #8490a6;
        --text-faint: #5b6579;

        --primary: #8ab4f8;
        --primary-container: #17334f;
        --on-primary: #0a0d13;

        --outline: #3a475d;
        --outline-soft: #232d3d;

        /* 卡片主色：最终由壁纸取色生成，这里先写死一档淡绿 */
        --wp-primary: #c8e6c9;
        --wp-primary-hover: #d6efd6;
        --wp-primary-strong: #a5cda6;
        --wp-ink: #c62828;
        /* 毛玻璃卡片高光，固定不随配置变化 */
        --card-sheen: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.22),
          rgba(255, 255, 255, 0.04)
        );

        --ease-out-quad: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-in-out-cubic: cubic-bezier(0.65, 0, 0.35, 1);
        --spring-snappy: cubic-bezier(0.2, 1.05, 0.3, 1);
        --spring-soft: cubic-bezier(0.25, 0.9, 0.35, 1.04);
        --spring-bouncy: cubic-bezier(0.34, 1.56, 0.44, 1);

        --blur-heavy: blur(34px) saturate(1.1);

        --mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
        --shadow-card: 0 18px 40px -22px rgba(0, 0, 0, 0.9);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        /* --spd 是全局时间倍率：慢放模式改它即可，不用复制整套动画 */
        --spd: 1;
        overflow: hidden;
        color: var(--text);
        font-family:
          "Inter",
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        background:
          radial-gradient(
            ellipse 65% 50% at 16% 6%,
            rgba(96, 140, 210, 0.1),
            transparent 60%
          ),
          radial-gradient(
            ellipse 55% 48% at 86% 94%,
            rgba(150, 110, 235, 0.08),
            transparent 62%
          ),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      body.slow {
        --spd: 3;
      }

      /* 测量 / 重置飞行变量时临时关掉过渡，避免页面加载时“从零飞入” */
      body.no-anim *,
      body.no-anim *::before,
      body.no-anim *::after {
        transition: none !important;
        animation: none !important;
      }

      /* ============================================================
       底层：假 niri 平铺窗口（关闭时看到的就是它们，也是散开的落点）
       ============================================================ */
      .stage {
        position: fixed;
        inset: 0;
        z-index: 0;
      }

      .ghost {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--w);
        height: var(--h);
        border-radius: 12px;
        overflow: hidden;
        background: linear-gradient(155deg, var(--c1), var(--c2));
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: var(--shadow-card);
      }

      .ghost-head {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 9px 12px;
        background: rgba(0, 0, 0, 0.16);
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }

      .ghost-head i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
      }

      .ghost-head span {
        margin-left: 6px;
        font: 11px/1 var(--mono);
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 0.04em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ghost-body {
        position: absolute;
        inset: 34px 0 0;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .g-line {
        height: 7px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.07);
      }

      .ghost-key {
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font: 700 11px var(--mono);
        color: rgba(255, 255, 255, 0.42);
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* ============================================================
       覆盖层
       ============================================================ */
      .overview {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        /* 注意：这里不做整体淡出，否则散开飞行会被一起透明掉 */
      }

      .overview.is-open {
        pointer-events: auto;
      }

      /* 背景固定毛玻璃：只有明暗/模糊的状态过渡，永远在窗口后面 */
      .scrim {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: linear-gradient(
          180deg,
          rgba(20, 28, 41, 0.52),
          rgba(8, 11, 17, 0.74)
        );
        backdrop-filter: blur(0px) saturate(1);
        transition:
          opacity calc(200ms * var(--spd)) var(--ease-out-quad),
          backdrop-filter calc(280ms * var(--spd)) var(--ease-out-quad);
      }

      .overview.is-open .scrim {
        opacity: 1;
        backdrop-filter: var(--blur-heavy);
      }

      .scrim::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          rgba(255, 255, 255, 0.06),
          transparent 32%,
          transparent 70%,
          rgba(255, 255, 255, 0.03)
        );
      }

      .overlay-content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 40px clamp(24px, 4vw, 48px) 132px;
      }

      /* ------------------------------------------------------------
         面板层（容器）：一律不做 opacity / transform 动画。
         容器 opacity 会和卡片 opacity 相乘，容器 transform 会和卡片
         transform 复合 —— 窗口的编排会被压平。这里只有文字的可见性。
         ------------------------------------------------------------ */
      .head {
        text-align: center;
        opacity: 0;
      }

      .head h1 {
        font-size: 13px;
        font-weight: 560;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .head p {
        margin-top: 6px;
        font: 11px/1 var(--mono);
        color: var(--text-dim);
        opacity: 0.75;
      }

      .hint {
        font: 11px/1 var(--mono);
        color: var(--text-faint);
        letter-spacing: 0.04em;
        opacity: 0;
      }

      .overview.is-open .head,
      .overview.is-open .hint {
        opacity: 1;
      }

      /* 无：文字随状态瞬时出现，面板完全没有动画（默认） */
      .chrome-none .head,
      .chrome-none .hint {
        transition: none;
      }

      /* 延后：等第一波窗口落位后再淡入，与窗口动画在时间上错开 */
      .chrome-late .head,
      .chrome-late .hint {
        transition: opacity calc(140ms * var(--spd)) var(--ease-out-quad);
      }

      .chrome-late .overview.is-open .head,
      .chrome-late .overview.is-open .hint {
        transition-delay: calc(340ms * var(--spd));
      }

      /* 关闭时立刻消失，避免文字拖在窗口飞回之后 */
      .chrome-late .overview:not(.is-open) .head,
      .chrome-late .overview:not(.is-open) .hint {
        transition-delay: 0s;
      }

      /* 同步：文字与窗口同时淡入 —— 对照组，用来看两层透明度叠加的效果 */
      .chrome-sync .head,
      .chrome-sync .hint {
        transition: opacity calc(280ms * var(--spd)) var(--ease-out-quad);
      }

      /* ============================================================
       窗口网格
       ============================================================ */
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        /* 行间距要大于键帽露出的 21px，否则会压到上一行 */
        column-gap: clamp(12px, 1.3vw, 20px);
        row-gap: clamp(28px, 2.4vw, 38px);
        width: min(1140px, 100%);
        /* 翻转入场用：给子元素提供 3D 透视 */
        perspective: 1400px;
      }

      .card {
        /* 所有位移/缩放都走变量：入场、飞行、hover、高亮互不覆盖 */
        --ty: 0px;
        --sc: 1;
        --rot: 0deg;
        --fx: 0px;
        --fy: 0px;
        --fsx: 1;
        --fsy: 1;
        --dly: 0s;

        position: relative;
        border-radius: 14px;
        /* 键帽要骑在卡片顶边上，卡片本身不能裁切；圆角由缩略图自己处理 */
        background: var(--card-sheen), var(--wp-primary);
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.45),
          0 18px 40px -22px rgba(0, 0, 0, 0.9);
        cursor: pointer;
        user-select: none;
        transform: translate(var(--fx), var(--fy)) translateY(var(--ty))
          scale(calc(var(--fsx) * var(--sc)), calc(var(--fsy) * var(--sc)))
          rotate(var(--rot)) rotateX(var(--rx, 0deg));
        transform-origin: center;
        transition:
          transform 0.24s var(--ease-out-quad),
          opacity 0.2s linear,
          background-color 0.22s var(--ease-out-quad),
          border-color 0.22s var(--ease-out-quad),
          box-shadow 0.3s var(--ease-out-quad);
        transition-delay: var(--dly);
        will-change: transform, opacity;
      }

      /* ---------- 出现：五种入场 ---------- */
      .appear-fly .card {
        /* 从窗口矩形飞到网格槽位：必须左上角对齐，位移+缩放才等价于矩形插值 */
        transform-origin: top left;
        transition:
          transform calc(560ms * var(--spd)) var(--ease-out-expo),
          opacity calc(240ms * var(--spd)) var(--ease-out-quad),
          background-color 0.22s var(--ease-out-quad),
          border-color 0.22s var(--ease-out-quad),
          box-shadow 0.3s var(--ease-out-quad);
        transition-delay: var(--dly);
      }

      /* 向上滑入：从下方滑上来 */
      .appear-slide_up .card {
        transition:
          transform calc(560ms * var(--spd)) var(--ease-out-expo),
          opacity calc(300ms * var(--spd)) var(--ease-out-quad),
          background-color 0.22s var(--ease-out-quad),
          border-color 0.22s var(--ease-out-quad),
          box-shadow 0.3s var(--ease-out-quad);
        transition-delay: var(--dly);
      }

      /* 翻转：卡片沿底边从“平躺”立起，网格提供透视 */
      .appear-flip .card {
        transform-origin: center bottom;
        transition:
          transform calc(620ms * var(--spd)) var(--spring-soft),
          opacity calc(220ms * var(--spd)) var(--ease-out-quad),
          background-color 0.22s var(--ease-out-quad),
          border-color 0.22s var(--ease-out-quad),
          box-shadow 0.3s var(--ease-out-quad);
        transition-delay: var(--dly);
      }

      /* 卷帘：卡片被自上而下裁开，全程不靠透明度 */
      .appear-unfold .card {
        clip-path: inset(0 0 0 0 round 14px);
        transition:
          transform calc(560ms * var(--spd)) var(--ease-out-expo),
          clip-path calc(560ms * var(--spd)) var(--ease-out-expo),
          background-color 0.22s var(--ease-out-quad),
          border-color 0.22s var(--ease-out-quad),
          box-shadow 0.3s var(--ease-out-quad);
        transition-delay: var(--dly);
      }

      .appear-zoom_rotate .card {
        transition:
          transform calc(640ms * var(--spd)) var(--spring-bouncy),
          opacity calc(300ms * var(--spd)) var(--ease-out-quad),
          background-color 0.22s var(--ease-out-quad),
          border-color 0.22s var(--ease-out-quad),
          box-shadow 0.3s var(--ease-out-quad);
        transition-delay: var(--dly);
      }

      /* ---------- 散开：关闭态（同一套落点，反方向飞回窗口） ---------- */
      .overview:not(.is-open) .card {
        /* inline 的 --fly-* 只在关闭态参与合成；打开后回到 0，
           transform 才会真正发生插值，飞行才会动 */
        --fx: var(--fly-x, 0px);
        --fy: var(--fly-y, 0px);
        --fsx: var(--fly-sx, 1);
        --fsy: var(--fly-sy, 1);
        opacity: 0;
        transition:
          transform calc(460ms * var(--spd)) var(--ease-in-out-cubic) var(--dly),
          opacity calc(150ms * var(--spd)) linear
            calc(var(--dly) + 280ms * var(--spd)),
          background-color 0.22s var(--ease-out-quad),
          border-color 0.22s var(--ease-out-quad),
          box-shadow 0.3s var(--ease-out-quad);
      }

      .appear-flip .overview:not(.is-open) .card {
        --rx: 82deg;
        --ty: 26px;
      }

      .appear-slide_up .overview:not(.is-open) .card {
        --ty: 56px;
      }

      .appear-zoom_rotate .overview:not(.is-open) .card {
        --sc: 0.34;
        --rot: -10deg;
      }

      /* 卷帘靠裁剪而不是透明度：关闭态保持不透明，避免整卡淡出 */
      .appear-unfold .overview:not(.is-open) .card {
        --ty: 12px;
        opacity: 1;
        clip-path: inset(0 0 100% 0 round 14px);
        transition:
          transform calc(460ms * var(--spd)) var(--ease-in-out-cubic) var(--dly),
          clip-path calc(460ms * var(--spd)) var(--ease-in-out-cubic) var(--dly),
          background-color 0.22s var(--ease-out-quad),
          border-color 0.22s var(--ease-out-quad),
          box-shadow 0.3s var(--ease-out-quad);
      }

      /* ---------- 聚集：stagger 曲线（只影响延迟） ----------
         数值直接决定“看不看得出来”：太小会被缓动曲线吃掉 */
      .gather-cascade .card {
        --dly: calc((var(--row) + var(--col)) * 0.09s * var(--spd));
      }

      .gather-circular .card {
        --dly: calc(var(--distance) * 0.2s * var(--spd));
      }

      .gather-random .card {
        --dly: calc(var(--random) * 0.4s * var(--spd));
      }

      .gather-wave .card {
        --dly: calc((var(--col) * 0.12s + var(--row) * 0.06s) * var(--spd));
      }

      /* ---------- 交互态 ---------- */
      .card:hover {
        --ty: -4px;
        --sc: 1.03;
        background: var(--card-sheen), var(--wp-primary-hover);
        border-color: rgba(255, 255, 255, 0.34);
        box-shadow: 0 20px 46px -16px var(--wp-primary);
        z-index: 2;
        transition-duration: 0.18s;
        transition-delay: 0s;
      }

      .card:active {
        --ty: -2px;
        --sc: 1.01;
      }

      .card.highlight {
        --ty: -3px;
        --sc: 1.02;
        background: var(--card-sheen), var(--wp-primary-hover);
        border-color: var(--wp-primary);
        /* 聚焦：阴影颜色就是主色 */
        box-shadow:
          0 0 0 2px var(--wp-primary),
          0 0 46px -6px var(--wp-primary);
        z-index: 3;
        transition-duration: 0.18s;
        transition-delay: 0s;
      }

      /* ============================================================
       卡片内容
       ============================================================ */
      .thumb {
        position: relative;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        /* 卡片边框 1px，这里用 13px 对齐 14px 外圆角 */
        border-radius: 13px 13px 0 0;
        background: linear-gradient(150deg, var(--c1), var(--c2));
      }

      .thumb::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 76px;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.42), transparent);
        pointer-events: none;
      }

      .thumb::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.07),
          transparent 42%
        );
        pointer-events: none;
      }

      /* 窗口内容铺满卡片上半部分：不再内缩成一张小窗 */
      .tw {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
      }

      .tw-head {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.22);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .tw-head i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
      }

      .tw-head span {
        margin-left: auto;
        font: 9px/1 var(--mono);
        color: rgba(255, 255, 255, 0.35);
      }

      .tw-body {
        flex: 1;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .tw-line {
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
      }

      .tw-line:nth-child(1) {
        width: 62%;
      }
      .tw-line:nth-child(2) {
        width: 88%;
        opacity: 0.7;
      }
      .tw-line:nth-child(3) {
        width: 74%;
        opacity: 0.45;
      }

      .tw-line:nth-child(4) {
        width: 92%;
        opacity: 0.33;
      }

      .tw-line:nth-child(5) {
        width: 58%;
        opacity: 0.24;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px 12px;
      }

      /* 字母键帽：压在缩略图顶部正中。
         只用纯色/渐变/圆角/边框/阴影，QML 里是 Rectangle + Text，不依赖 blur */
      .key-badge {
        position: absolute;
        /* 32px 高：露在卡片外约 21px，压在缩略图上约 11px（≈1/3） */
        top: -22px;
        left: 50%;
        z-index: 2;
        transform: translateX(-50%);
        min-width: 36px;
        height: 32px;
        padding: 0 9px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font: 700 15px/1 var(--mono);
        letter-spacing: 0.02em;
        color: var(--wp-ink);
        background: linear-gradient(180deg, #d9f0d9, var(--wp-primary));
        border: 1px solid rgba(0, 0, 0, 0.22);
        box-shadow:
          0 2px 0 rgba(0, 0, 0, 0.32),
          0 10px 22px -10px rgba(0, 0, 0, 0.8);
        transition:
          transform 0.2s var(--spring-soft),
          background-color 0.2s var(--ease-out-quad),
          color 0.2s var(--ease-out-quad),
          box-shadow 0.2s var(--ease-out-quad);
      }

      .card:hover .key-badge {
        transform: translateX(-50%) translateY(-1px) scale(1.04);
      }

      .card.highlight .key-badge {
        color: var(--wp-primary);
        background: linear-gradient(180deg, #e04b4b, var(--wp-ink));
        border-color: rgba(0, 0, 0, 0.3);
        box-shadow:
          0 2px 0 rgba(0, 0, 0, 0.4),
          0 0 26px rgba(198, 40, 40, 0.55);
        transform: translateX(-50%) scale(1.08);
      }

      .title {
        flex: 1;
        min-width: 0;
      }

      .title strong {
        display: block;
        font-size: 12.5px;
        font-weight: 570;
        color: var(--wp-ink);
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .title span {
        display: block;
        margin-top: 3px;
        font: 10px/1 var(--mono);
        color: var(--wp-ink);
        opacity: 0.62;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ============================================================
       控制台（底部，避免压住网格）
       ============================================================ */
      .dock {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        /* left:50% 会让 fixed 元素的可用宽度只剩半屏，必须显式给 max-content，
           否则按钮会被挤成多行 */
        width: max-content;
        max-width: calc(100vw - 28px);
        z-index: 400;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        flex-wrap: wrap;
        gap: 14px;
        max-width: calc(100vw - 28px);
        padding: 12px 16px;
        border-radius: 16px;
        background: rgba(17, 23, 33, 0.84);
        backdrop-filter: blur(20px) saturate(1.1);
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow: 0 30px 70px -24px rgba(0, 0, 0, 0.85);
      }

      .seg {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .seg-label {
        font: 600 9.5px/1 var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-faint);
      }

      .seg-row {
        display: flex;
        gap: 6px;
      }

      .chip {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid var(--outline-soft);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-dim);
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background-color 0.18s var(--ease-out-quad),
          color 0.18s var(--ease-out-quad),
          border-color 0.18s var(--ease-out-quad),
          transform 0.18s var(--spring-soft);
      }

      .chip:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.07);
        border-color: var(--outline);
      }

      .chip:active {
        transform: scale(0.96);
      }

      .chip.active {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--on-primary);
        font-weight: 600;
      }

      .dock-sep {
        width: 1px;
        align-self: stretch;
        margin: 2px;
        background: rgba(255, 255, 255, 0.07);
      }

      .replay {
        padding: 9px 16px;
        border-radius: 9px;
        cursor: pointer;
        border: 1px solid var(--primary);
        color: var(--primary);
        background: rgba(138, 180, 248, 0.08);
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.03em;
        transition:
          background-color 0.2s var(--ease-out-quad),
          color 0.2s var(--ease-out-quad),
          transform 0.2s var(--spring-soft);
      }

      .replay:hover {
        background: var(--primary);
        color: var(--on-primary);
        transform: translateY(-1px);
      }

      .replay:active {
        transform: scale(0.97);
      }

      /* ============================================================
       Toast
       ============================================================ */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 112px;
        transform: translate(-50%, 14px);
        z-index: 450;
        padding: 9px 18px;
        border-radius: 9px;
        background: rgba(17, 23, 33, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font: 11px/1 var(--mono);
        color: var(--text);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.24s var(--ease-out-quad),
          transform 0.3s var(--spring-soft);
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* ============================================================
       响应式
       ============================================================ */
      @media (max-width: 1100px) {
        .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 760px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .overlay-content {
          padding-bottom: 168px;
        }
      }
    </style>
  </head>
  <body class="appear-fly gather-cascade chrome-none">
    <!-- 底层：真实窗口的替身，也是卡片散开的落点 -->
    <div class="stage" aria-hidden="true"></div>

    <!-- 总览覆盖层 -->
    <div class="overview" id="overview">
      <div class="scrim"></div>
      <div class="overlay-content">
        <header class="head">
          <h1>窗口总览</h1>
          <p>A–H 直达 · Esc 关闭 · 空格开关</p>
        </header>
        <div class="grid" id="grid"></div>
        <p class="hint" id="hint"></p>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- 控制台 -->
    <footer class="dock">
      <div class="seg">
        <span class="seg-label">出现</span>
        <div class="seg-row">
          <button class="chip active" data-appear="fly">归位</button>
          <button class="chip" data-appear="slide_up">向上滑入</button>
          <button class="chip" data-appear="zoom_rotate">缩放旋转</button>
          <button class="chip" data-appear="flip">翻转</button>
          <button class="chip" data-appear="unfold">卷帘</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <div class="seg">
        <span class="seg-label">聚集</span>
        <div class="seg-row">
          <button class="chip active" data-gather="cascade">网格级联</button>
          <button class="chip" data-gather="circular">圆形扩散</button>
          <button class="chip" data-gather="random">随机</button>
          <button class="chip" data-gather="wave">波浪</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <div class="seg">
        <span class="seg-label">面板</span>
        <div class="seg-row">
          <button class="chip active" data-chrome="none">无</button>
          <button class="chip" data-chrome="late">延后</button>
          <button class="chip" data-chrome="sync">同步</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <div class="seg">
        <span class="seg-label">速度</span>
        <div class="seg-row">
          <button class="chip" id="slowBtn">慢放 1 / 3</button>
        </div>
      </div>

      <button class="replay" id="replayBtn">重播</button>
    </footer>

    <script>
      (() => {
        "use strict";

        // g: 假 niri 布局里这块窗口的位置（视口百分比）
        const WINDOWS = [
          {
            key: "A",
            app: "firefox",
            title: "Niri 滚动平铺 · 官方文档",
            c1: "#2b3d55",
            c2: "#141c27",
            g: [2, 8, 24, 38],
          },
          {
            key: "B",
            app: "kitty",
            title: "~/.config/niri/config.kdl",
            c1: "#26402f",
            c2: "#141d17",
            g: [2, 50, 24, 38],
          },
          {
            key: "C",
            app: "vscode",
            title: "quickshell-overview.qml",
            c1: "#2b3550",
            c2: "#161a26",
            g: [28, 8, 30, 56],
          },
          {
            key: "D",
            app: "nautilus",
            title: "主文件夹",
            c1: "#3d3327",
            c2: "#1f1a14",
            g: [28, 68, 30, 24],
          },
          {
            key: "E",
            app: "mpv",
            title: "demo-animation.mp4",
            c1: "#402a36",
            c2: "#221720",
            g: [60, 8, 22, 30],
          },
          {
            key: "F",
            app: "obsidian",
            title: "Wayland 合成器开发笔记",
            c1: "#302a45",
            c2: "#181524",
            g: [60, 42, 22, 26],
          },
          {
            key: "G",
            app: "discord",
            title: "#quickshell-dev",
            c1: "#2a3448",
            c2: "#161b25",
            g: [60, 72, 22, 20],
          },
          {
            key: "H",
            app: "foot",
            title: "niri msg action focus-workspace",
            c1: "#2c3a3a",
            c2: "#171f1f",
            g: [84, 8, 14, 40],
          },
        ];

        const COLS = 4;

        const stage = document.querySelector(".stage");
        const overview = document.getElementById("overview");
        const grid = document.getElementById("grid");
        const hint = document.getElementById("hint");
        const toast = document.getElementById("toast");
        const slowBtn = document.getElementById("slowBtn");

        let appear = "fly";
        let gather = "cascade";
        let chrome = "none";
        let slow = false;
        let isOpen = false;
        let toastTimer = 0;

        const ghosts = new Map();

        /* ---------------- 构建 DOM ---------------- */

        function esc(s) {
          return String(s).replace(
            /[&<>"']/g,
            (m) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[m],
          );
        }

        function build() {
          stage.innerHTML = WINDOWS.map(
            (w) => `
            <div class="ghost" data-key="${w.key}"
                 style="--x:${w.g[0]}%;--y:${w.g[1]}%;--w:${w.g[2]}%;--h:${w.g[3]}%;--c1:${w.c1};--c2:${w.c2}">
              <div class="ghost-head"><i></i><i></i><i></i><span>${esc(w.app)}</span></div>
              <div class="ghost-body">
                <div class="g-line" style="width:52%"></div>
                <div class="g-line" style="width:78%;opacity:.7"></div>
                <div class="g-line" style="width:64%;opacity:.5"></div>
                <div class="g-line" style="width:84%;opacity:.35"></div>
              </div>
              <div class="ghost-key">${w.key}</div>
            </div>`,
          ).join("");

          const rows = Math.ceil(WINDOWS.length / COLS);
          grid.innerHTML = WINDOWS.map((w, i) => {
            const row = Math.floor(i / COLS);
            const col = i % COLS;
            const dist = Math.hypot(
              row - (rows - 1) / 2,
              col - (COLS - 1) / 2,
            ).toFixed(2);
            const rnd = Math.random().toFixed(3);

            return `
              <div class="card" data-key="${w.key}"
                   style="--i:${i};--row:${row};--col:${col};--distance:${dist};--random:${rnd};--c1:${w.c1};--c2:${w.c2}">
                <div class="thumb">
                  <div class="tw">
                    <div class="tw-head"><i></i><i></i><i></i><span>${esc(w.app)}</span></div>
                    <div class="tw-body">
                      <div class="tw-line"></div>
                      <div class="tw-line"></div>
                      <div class="tw-line"></div>
                      <div class="tw-line"></div>
                      <div class="tw-line"></div>
                    </div>
                  </div>
                </div>
                <div class="meta">
                  <div class="title">
                    <strong>${esc(w.title)}</strong>
                    <span>${esc(w.app)}</span>
                  </div>
                </div>
                <div class="key-badge">${w.key}</div>
              </div>`;
          }).join("");

          ghosts.clear();
          stage
            .querySelectorAll(".ghost")
            .forEach((g) => ghosts.set(g.dataset.key, g));

          grid.querySelectorAll(".card").forEach((card) => {
            card.addEventListener("click", (e) => {
              e.stopPropagation();
              jump(card.dataset.key);
            });
          });
        }

        /* ---------------- 开 / 关 ---------------- */

        function resetFlyVars() {
          for (const card of grid.children) {
            card.style.setProperty("--fly-x", "0px");
            card.style.setProperty("--fly-y", "0px");
            card.style.setProperty("--fly-sx", "1");
            card.style.setProperty("--fly-sy", "1");
          }
        }

        // 归位入场：把每张卡片反推回对应窗口的矩形，
        // 再在同一帧解除 no-anim / 打开覆盖层，让 transform 自然插值到网格槽位。
        function primeFlight() {
          const cards = [...grid.children];

          document.body.classList.add("no-anim");
          resetFlyVars();
          void grid.offsetWidth; // 先让“零偏移”成为已计算样式

          if (appear === "fly") {
            const targets = cards.map((c) => c.getBoundingClientRect());

            cards.forEach((card, i) => {
              const ghost = ghosts.get(card.dataset.key).getBoundingClientRect();
              const target = targets[i];
              card.style.setProperty(
                "--fly-x",
                (ghost.left - target.left).toFixed(2) + "px",
              );
              card.style.setProperty(
                "--fly-y",
                (ghost.top - target.top).toFixed(2) + "px",
              );
              card.style.setProperty(
                "--fly-sx",
                (ghost.width / target.width).toFixed(4),
              );
              card.style.setProperty(
                "--fly-sy",
                (ghost.height / target.height).toFixed(4),
              );
            });
            void grid.offsetWidth; // 让起始矩形成为已计算样式
          }

          document.body.classList.remove("no-anim");
        }

        function clearHighlights() {
          grid
            .querySelectorAll(".card.highlight")
            .forEach((c) => c.classList.remove("highlight"));
        }

        function open() {
          if (isOpen) return;
          isOpen = true;
          clearHighlights();
          primeFlight();
          overview.classList.add("is-open");
        }

        function close(message) {
          if (!isOpen) return;
          isOpen = false;
          overview.classList.remove("is-open");
          if (message) showToast(message);
        }

        function replay() {
          close();
          setTimeout(open, slow ? 1500 : 520);
        }

        /* ---------------- 跳转 ---------------- */

        function jump(key) {
          if (!isOpen) {
            open();
            setTimeout(() => jump(key), slow ? 900 : 320);
            return;
          }

          const card = grid.querySelector(`.card[data-key="${key}"]`);
          if (!card) return;

          clearHighlights();
          card.classList.add("highlight");

          setTimeout(
            () => {
              const title = card.querySelector("strong").textContent;
              close(`跳转 → ${key} · ${title}`);
            },
            slow ? 900 : 300,
          );
        }

        function showToast(message) {
          toast.textContent = message;
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
        }

        /* ---------------- 控制台状态 ---------------- */

        const APPEAR_LABEL = {
          fly: "归位",
          slide_up: "向上滑入",
          zoom_rotate: "缩放旋转",
          flip: "翻转",
          unfold: "卷帘",
        };
        const GATHER_LABEL = {
          cascade: "网格级联",
          circular: "圆形扩散",
          random: "随机",
          wave: "波浪",
        };
        // 直接读每张卡的实际 transition-delay，把 stagger 幅度显示出来，
        // 这样“聚集设置有没有生效”是可验证的，而不是靠感觉
        function delayRange() {
          let min = Infinity;
          let max = -Infinity;
          for (const card of grid.children) {
            const raw = getComputedStyle(card)
              .transitionDelay.split(",")[0]
              .trim();
            const ms = raw.endsWith("ms")
              ? parseFloat(raw)
              : parseFloat(raw) * 1000;
            min = Math.min(min, ms);
            max = Math.max(max, ms);
          }
          return `${Math.round(min)}–${Math.round(max)}ms`;
        }

        function sync() {
          hint.textContent = `${APPEAR_LABEL[appear]} · ${GATHER_LABEL[gather]} · 延迟 ${delayRange()} · 毛玻璃 · ${slow ? "0.33×" : "1×"}`;

          document.querySelectorAll("[data-appear]").forEach((b) => {
            b.classList.toggle("active", b.dataset.appear === appear);
          });
          document.querySelectorAll("[data-gather]").forEach((b) => {
            b.classList.toggle("active", b.dataset.gather === gather);
          });
          document.querySelectorAll("[data-chrome]").forEach((b) => {
            b.classList.toggle("active", b.dataset.chrome === chrome);
          });
          slowBtn.classList.toggle("active", slow);
        }

        function setAppear(value) {
          if (value === appear) return;
          document.body.classList.remove(`appear-${appear}`);
          appear = value;
          document.body.classList.add(`appear-${appear}`);
          sync();
          replay();
        }

        function setGather(value) {
          if (value === gather) return;
          document.body.classList.remove(`gather-${gather}`);
          gather = value;
          document.body.classList.add(`gather-${gather}`);
          sync();
          replay();
        }

        // 面板层：只切换文字可见性的方式，不触碰容器 opacity / transform
        function setChrome(value) {
          if (value === chrome) return;
          document.body.classList.remove(`chrome-${chrome}`);
          chrome = value;
          document.body.classList.add(`chrome-${chrome}`);
          sync();
        }

        /* ---------------- 键盘 ---------------- */

        function onKey(e) {
          if (e.metaKey || e.ctrlKey || e.altKey) return;

          const key = e.key.toUpperCase();

          if (/^[A-H]$/.test(key)) {
            e.preventDefault();
            jump(key);
            return;
          }

          if (e.key === "Escape") {
            e.preventDefault();
            close();
            return;
          }

          if (e.key === " " || e.key === "Enter") {
            e.preventDefault();
            isOpen ? close() : open();
          }
        }

        /* ---------------- 启动 ---------------- */

        function init() {
          build();
          sync();

          document.querySelectorAll("[data-appear]").forEach((b) => {
            b.addEventListener("click", () => setAppear(b.dataset.appear));
          });
          document.querySelectorAll("[data-gather]").forEach((b) => {
            b.addEventListener("click", () => setGather(b.dataset.gather));
          });
          document.querySelectorAll("[data-chrome]").forEach((b) => {
            b.addEventListener("click", () => setChrome(b.dataset.chrome));
          });

          slowBtn.addEventListener("click", () => {
            slow = !slow;
            document.body.classList.toggle("slow", slow);
            sync();
          });

          document.getElementById("replayBtn").addEventListener("click", replay);

          // 点击空白处关闭（卡片自己 stopPropagation）
          overview.addEventListener("click", () => close());

          window.addEventListener("keydown", onKey);
          window.focus();

          setTimeout(open, 900);
        }

        init();
      })();
    </script>
  </body>
</html>
